core_question: >
  What is the smallest practical architecture that lets replaceable AI-agent
  sessions perform long-horizon work over days/weeks/months without silently
  losing project intent, accepted state, provenance, unfinished obligations,
  child-agent work, or the distinction between “work finished” and “result accepted”?

headline_verdict: >
  Persistent AI memory is not the central problem. The central problem is
  durable authoritative state plus recovery discipline. Almost every proposed
  “agent OS / control plane” layer is a reinvention of Git, durable workflows,
  tickets, branch protection, policy engines, workload identity, and traces.
  After the commodity test, zero custom subsystems survive a strict BUILD bar.
  The only justified addition is a thin WRAP: a versioned handoff/acceptance
  contract stored outside the model, a deterministic recovery projector, and
  enforcement that the model cannot mark work accepted.

